  _lsKey: 'ha_backendUrl',
  getUrl: function(){

    });

  }
  function money(v) {
    var cur = (state.data && state.data.config && state.data.config.business.currency) || 'Rs';

  }

  /* ------------------------------ storage -------------------------------- */

  /* ------------------------- theme (manual + system) ---------------------- */
  function applyTheme() {

  }
  function toggleTheme(){

  }
  applyTheme();

  /* ------------------------------ offline queue --------------------------- */
  function qKey() { return QUEUE_KEY + appId; }
  function queue() { return get(qKey(), []); }
  function enqueue(action, payload) {
    var q = queue();
    if (q.length >= ((state.data && state.data.config && state.data.config.offline.maxQueue) || 200)) {
      toast('Offline queue bhar gayi — pehle sync karein', 'err'); return null;
    }
    var id = 'c' + Date.now() + Math.random().toString(36).slice(2, 7);

    set(qKey(), q); updateNet(); return id;
  }
  function queuedCount() { return queue().length; }

  async function sync() {
    var q = queue();

  /* ------------------------------- boot ---------------------------------- */

  async function load(tabs, renderTab) {

    } catch (e) {

  /* manifest data-URI: Apps Script static file serve nahi karta */
  function injectManifest(id) {

    var ver = cfg.version || '2.19';
    var manifest = {
      name: app.name || document.title, short_name: app.shortName || document.title.split('—').pop().trim(),
      description: app.desc || '',

      orientation: 'portrait', background_color: app.theme||'#0b1220', theme_color: app.theme||'#0b1220',
      categories: ['business','shopping','productivity'],
      lang: 'en', dir: 'ltr',
      shortcuts: ([
        { name:'Dashboard', url:'?app='+id, icons:[{src:(typeof PWA_ICON_192==='string'?PWA_ICON_192:''), sizes:'192x192'}] }
      ]),

        { src: PWA_ICON_192, sizes: '192x192', type: 'image/png', purpose: 'any' },

    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));

  }

  function ensureTopActions(){

  function setupInstallPrompt(){

    if(navigator.share){ navigator.share({title:title, url:url}).catch(function(){}); }

    else { prompt('Copy link', url); }
  }
  function requestNotif(){
    if(!('Notification' in window)) return toast('Notifications supported nahi','warn');
    Notification.requestPermission().then(function(p){ toast(p==='granted' ? 'Notifications ON ✅' : 'Permission: '+p, p==='granted'?'ok':'warn'); });

  function setupSW(){
    // Apps Script cannot host SW; demo/static hosts can.
    if(location.hostname.indexOf('script.google')>-1) return;
    if(!('serviceWorker' in navigator)) return;
    if(document.querySelector('link[rel=\"manifest\"][href^=\"data:\"]')) return; // data URI manifest already
    try{
      // try /sw.js if exists (demo build emits one)
      navigator.serviceWorker.register('/sw.js').then(function(){ /* ok */ }, function(){});
    }catch(e){}
  }

  // camera barcode helper — enterprise: external PWA scanner → BarcodeDetector → file fallback
  function scanWithExternal(onResult){
    try{
      var live = (state.data && state.data.config && state.data.config.scannerLiveUrl) || '';
      if(live){
        var ret = location.href.split('?')[0].split('#')[0];
        var nonce = Math.random().toString(36).slice(2,9);
        var url = live + (live.indexOf('?')>-1 ? '&' : '?') + 'ret=' + encodeURIComponent(ret) + '&n=' + nonce + '&t=' + Date.now();
        var w = window.open(url, '_blank');
        if(w){
          var handler = function(ev){
            try{
              if(!ev || !ev.data || ev.data.type!=='HASEEB_QR_RESULT' || ev.data.nonce!==nonce) return;
              window.removeEventListener('message', handler);
              var code = String(ev.data.code||ev.data.text||'').trim();
              if(code){ haptic(true); onResult(code); }
            }catch(e){}
          };
          window.addEventListener('message', handler);
          setTimeout(function(){ window.removeEventListener('message', handler); }, 120000);
          return true;
        }
      }
    }catch(e){}
    return false;
  }
  async function scanWithCamera(onResult){
    if(scanWithExternal(onResult)) return;
    if('BarcodeDetector' in window){
      try{
        var detector = new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','qr_code']});
        var stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        var wrap = el('div',{style:'position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column'});
        var video = el('video',{autoplay:true, playsinline:true, style:'width:100%;flex:1;object-fit:cover'});
        video.srcObject = stream;
        var bar = el('div',{style:'padding:12px;background:#0b1220;display:flex;gap:8px'}, [
          el('button',{class:'btn ghost block', onclick:close}, '✕ Cancel'),
          el('div',{style:'color:#93a3c4;font-size:12px;flex:1;display:flex;align-items:center'}, 'Camera se barcode scan karein')
        ]);
        wrap.appendChild(video); wrap.appendChild(bar); document.body.appendChild(wrap); video.play();
        var stopped=false;
        function close(){ stopped=true; try{ stream.getTracks().forEach(function(t){t.stop();}); }catch(e){} try{ wrap.remove(); }catch(e){} }
        var loop = async function(){
          if(stopped) return;
          try{
            var codes = await detector.detect(video);
            if(codes && codes.length){ var val=codes[0].rawValue||''; if(val){ close(); haptic(true); onResult(val); return; } }
          }catch(e){}
          setTimeout(loop, 280);
        };
        setTimeout(loop, 400);
        wrap.addEventListener('click', function(e){ if(e.target===wrap) close(); });
        return;
      }catch(e){ /* fallback */ }
    }
    // fallback: file input
    var inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
    inp.onchange = function(){ var f=inp.files&&inp.files[0]; if(!f) return; toast('Image mili — manual entry use karein','warn'); };
    inp.click();
  }
  // Bulk picker — shared enterprise multi-select (mirrors UI2.itemPicker)
  function openBulkPicker(opts){
    var items = (opts && opts.items) || [];
    var onAdd = opts && opts.onAdd;
    var title = (opts && opts.title) || 'Bulk add — items chunein';
    var picked = {}; // id -> {item, qty}
    var overlay = el('div', { class:'bulk-picker', onclick:function(e){ if(e.target===overlay) close(); } });
    var box = el('div', { class:'bulk-box' });
    var head = el('div', { class:'bulk-head' }, [ el('b',{text:title}), el('span',{class:'pill', id:'bulkCount', text:'0 selected'}), el('button',{class:'btn sm ghost', onclick:close}, '✕') ]);
    var searchWrap = el('div', { class:'bulk-search' });
    var sIn = el('input', { type:'search', placeholder:'🔎 Search name / code / barcode…', 'aria-label':'Search bulk items' });
    searchWrap.appendChild(sIn);
    var list = el('div', { class:'bulk-list' });
    var actions = el('div', { class:'bulk-actions' }, [
      el('button',{class:'btn ghost', onclick:close}, 'Cancel'),
      el('button',{class:'btn primary', id:'bulkAddBtn', onclick:commit}, 'Add selected (0)')
    ]);
    box.appendChild(head); box.appendChild(searchWrap); box.appendChild(list); box.appendChild(actions);
    overlay.appendChild(box); document.body.appendChild(overlay);
    document.body.style.overflow='hidden';
    function close(){ try{ overlay.remove(); }catch(e){} document.body.style.overflow=''; }
    function render(){
      var q = String(sIn.value||'').trim().toLowerCase();
      list.innerHTML='';
      var filtered = items;
      if(q) filtered = items.filter(function(it){ return String(it.name||'').toLowerCase().indexOf(q)>-1 || String(it.code||'').toLowerCase().indexOf(q)>-1 || String(it.barcode||'').toLowerCase()===q; });
      filtered = filtered.slice(0,120);
      if(!filtered.length){ list.appendChild(el('div',{class:'empty', text:'Koi item nahi mila'})); return; }
      filtered.forEach(function(it){
        var sel = !!picked[it.id];
        var row = el('div', { class:'bulk-item'+(sel?' on':''), onclick:function(e){
          if(e.target && e.target.tagName==='INPUT' && e.target.type==='number') return;
          if(picked[it.id]) delete picked[it.id]; else picked[it.id]={item:it, qty:1};
          updateHead(); render();
        }});
        var cb = el('input',{type:'checkbox', checked: sel});
        cb.addEventListener('click', function(e){ e.stopPropagation(); if(cb.checked) picked[it.id]={item:it,qty:1}; else delete picked[it.id]; updateHead(); render(); });
        var tx = el('div',{class:'tx'}, [ el('b',{text: it.name}), el('small',{text: (it.code||'') + ' · ' + money(it.retail||it.price||0) + ' · stock ' + (it.stock||0) }) ]);
        var qty = el('input',{type:'number', value: String((picked[it.id] && picked[it.id].qty)||1), min:'1', style:'width:64px;min-height:38px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);text-align:center;font-weight:800'});
        qty.addEventListener('input', function(){ var v=Math.max(1, Number(qty.value)||1); if(picked[it.id]) picked[it.id].qty=v; updateHead(); });
        qty.addEventListener('click', function(e){ e.stopPropagation(); });
        row.appendChild(cb); row.appendChild(tx); row.appendChild(qty);
        list.appendChild(row);
      });
    }
    function updateHead(){
      var n = Object.keys(picked).length;
      var c = box.querySelector('#bulkCount'); if(c) c.textContent = n + ' selected';
      var b = box.querySelector('#bulkAddBtn'); if(b) b.textContent = 'Add selected (' + n + ')';
    }
    function commit(){
      var vals = Object.keys(picked).map(function(k){ var p=picked[k]; return { item:p.item, qty: Math.max(1, Number(p.qty)||1) }; });
      if(!vals.length) return toast('Koi item select nahi kiya','warn');
      close(); haptic(true);
      if(typeof onAdd==='function') onAdd(vals);
    }
    sIn.addEventListener('input', render);
    render(); sIn.focus();
  }

  // ===== CUSTOMER PICKER — shared autocomplete (fixes datalist re-click bug) =====
  function createCustomerField(opts){
    opts = opts || {};
    var customers = opts.customers || [];
    var placeholder = opts.placeholder || 'Customer naam';
    var initial = opts.value || '';
    var onSelect = opts.onSelect || function(){};
    var labelTxt = opts.label || 'Customer';
    var wrap = el('div', {class:'f cust-field'});
    var label = el('label', {text: labelTxt});
    var inputWrap = el('div', {class:'cust-input-wrap'});
    var input = el('input', {type:'text', placeholder: placeholder, value: initial, autocomplete:'off', 'aria-label': labelTxt, 'aria-autocomplete':'list', 'aria-expanded':'false'});
    var clearBtn = el('button', {class:'cust-clear', type:'button', title:'Clear', 'aria-label':'Clear customer'}, '✕');
    inputWrap.appendChild(input);
    inputWrap.appendChild(clearBtn);
    var dd = el('div', {class:'cust-dropdown', role:'listbox'});
    var hint = el('div', {class:'cust-hint muted', id: (opts.hintId||'')});
    if(opts.hintText) hint.textContent = opts.hintText;
    wrap.appendChild(label);
    wrap.appendChild(inputWrap);
    wrap.appendChild(dd);
    if(hint) wrap.appendChild(hint);
    var selectedId = opts.selectedId || '';
    var isOpen = false;
    var closeTimer = null;
    function setSelected(customer){
      if(customer){
        selectedId = customer.id;
        input.value = customer.name;
        input.setAttribute('aria-expanded','false');
      } else {
        selectedId = '';
      }
      onSelect(customer, input.value.trim());
    }
    function filterList(q){
      q = String(q||'').trim().toLowerCase();
      var list = customers;
      if(q){
        list = customers.filter(function(c){ return c.name.toLowerCase().indexOf(q)>-1 || String(c.phone||'').indexOf(q)>-1; });
      }
      return list.slice(0, 20);
    }
    function renderDropdown(){
      var q = String(input.value||'').trim().toLowerCase();
      var list = filterList(input.value);
      dd.innerHTML = '';
      if(!list.length){
        // no match — offer to create new
        if(q){
          var addRow = el('div', {class:'cust-add-row', text: '＋ Naya customer: \"' + input.value.trim() + '\"'});
          addRow.onclick = function(){ setSelected(null); closeDd(); };
          dd.appendChild(addRow);
        } else {
          dd.appendChild(el('div', {class:'empty', style:'padding:12px', text:'Koi customer nahi'}));
        }
      } else {
        list.forEach(function(c){
          var isSel = c.id===selectedId;
          var bal = Number(c.bal||0);
          var row = el('div', {class:'cust-opt'+(isSel?' on':''), role:'option', 'aria-selected': isSel?'true':'false'});
          row.appendChild(el('div', {class:'ico', text:'👤'}));
          var tx = el('div', {class:'tx'});
          tx.appendChild(el('b', {text: c.name}));
          tx.appendChild(el('small', {text: (c.phone? c.phone+' · ':'') + (bal? 'Due '+money(bal):'No dues') + (c.priceTier? ' · '+c.priceTier:'' )}));
          row.appendChild(tx);
          row.appendChild(el('span', {class:'badge '+(bal>0?'warn':''), text: c.priceTier||'RETAIL'}));
          row.addEventListener('click', function(e){ e.stopPropagation(); setSelected(c); closeDd(); input.focus(); });
          // touch feedback
          row.addEventListener('mousedown', function(e){ e.preventDefault(); });
          dd.appendChild(row);
        });
        if(q && !list.some(function(c){ return c.name.toLowerCase()===q; })){
          var addRow2 = el('div', {class:'cust-add-row', text: '＋ Naya: \"' + input.value.trim() + '\" ke naam se'});
          addRow2.onclick = function(){ setSelected(null); closeDd(); };
          dd.appendChild(addRow2);
        }
      }
    }
    function openDd(){
      if(isOpen) return;
      isOpen = true;
      renderDropdown();
      dd.classList.add('show');
      input.setAttribute('aria-expanded','true');
      // FIX: dropdown clipped by .card{overflow:hidden} — use fixed positioning aligned to input
      try{
        var rect = inputWrap.getBoundingClientRect();
        if(rect && rect.width){
          dd.classList.add('as-fixed');
          dd.style.top = (rect.bottom + 6) + 'px';
          dd.style.left = rect.left + 'px';
          dd.style.width = rect.width + 'px';
          // keep within viewport vertically
          var vh = window.innerHeight || 600;
          var maxH = Math.min(260, vh - rect.bottom - 20);
          if(maxH < 120) maxH = 120;
          dd.style.maxHeight = maxH + 'px';
        }
      }catch(e){}
    }
    function closeDd(){
      isOpen = false;
      dd.classList.remove('show');
      dd.classList.remove('as-fixed');
      dd.style.top=''; dd.style.left=''; dd.style.width=''; dd.style.maxHeight='';
      input.setAttribute('aria-expanded','false');
    }
    function refreshHint(){
      // caller updates hint via onSelect, nothing to do here
    }
    // events
    input.addEventListener('focus', function(){ openDd(); renderDropdown(); });
    input.addEventListener('click', function(){ openDd(); renderDropdown(); });
    input.addEventListener('input', function(){
      selectedId = '';
      // find exact match
      var exact = customers.filter(function(c){ return c.name.toLowerCase()===String(input.value).trim().toLowerCase(); })[0];
      if(exact) selectedId = exact.id;
      onSelect(exact||null, input.value.trim());
      openDd();
      renderDropdown();
    });
    input.addEventListener('keydown', function(e){
      if(e.key==='Escape'){ closeDd(); input.blur(); }
      if(e.key==='Enter'){ // keep dropdown open but allow selection via first match
        // if dropdown shows one exact, select it
      }
    });
    clearBtn.addEventListener('click', function(e){
      e.stopPropagation();
      input.value = '';
      selectedId='';
      onSelect(null, '');
      renderDropdown();
      openDd();
      input.focus();
      haptic(true);
    });
    // click outside to close
    document.addEventListener('click', function(e){
      if(!wrap.contains(e.target)) closeDd();
    });
    window.addEventListener('resize', function(){ if(isOpen) openDd(); });
    window.addEventListener('scroll', function(){ if(isOpen) openDd(); }, true);
    // allow external updates
    function setCustomers(newList){
      customers = newList || [];
      renderDropdown();
    }
    function setValue(name, id){
      input.value = name||'';
      selectedId = id||'';
      renderDropdown();
    }
    function getValue(){ return { name: input.value.trim(), id: selectedId, input: input }; }
    // initial render if value preset
    if(initial){
      var m = customers.filter(function(c){ return c.name.toLowerCase()===String(initial).trim().toLowerCase(); })[0];
      if(m) selectedId = m.id;
    }
    renderDropdown();
    return { wrap: wrap, field: wrap, input: input, dropdown: dd, hint: hint, clearBtn: clearBtn, setCustomers: setCustomers, setValue: setValue, getValue: getValue, open: openDd, close: closeDd };
  }
  function attachCustomerAutocomplete(input, customers, onPick){
    // legacy helper — wraps existing input
    var cf = createCustomerField({ customers: customers, value: input.value, placeholder: input.placeholder, label: '', onSelect: onPick });
    // replace input in DOM with new field's input
    try{ input.parentNode.replaceChild(cf.wrap, input); }catch(e){}
    return cf;
  }

  return {
    boot: boot, call: call, api: call, toast: toast, el: el, $: $, money: money, haptic:haptic,
    sync: sync, logout: logout, updateNet: updateNet, install:install, shareApp:shareApp, requestNotif:requestNotif, toggleTheme:toggleTheme, scanWithCamera:scanWithCamera, openBulkPicker:openBulkPicker, createCustomerField:createCustomerField, attachCustomerAutocomplete:attachCustomerAutocomplete,
    get state() { return state; },
    get data() { return state.data; },
    get cart() { return state.cart; },
    set cart(v) { state.cart = v; },
    queuedCount: queuedCount, reload: function () { load(state.tabs || [], state.renderTab); }
  };
})();

function HA_applyExtraMeta(obj) {
  try {
    if (!obj || !document || !document.head) return;
    Object.keys(obj).forEach(function (k) {
      if (!k || obj[k] === null || obj[k] === undefined) return;
      var m = document.querySelector('meta[name=\"' + k + '\"]');
      if (!m) {
        m = document.createElement('meta');
        m.setAttribute('name', k);
        document.head.appendChild(m);
      }
      m.setAttribute('content', String(obj[k]));
    });
  } catch (e) { }
}

    'pwa.wh.count.get': function(p){ var id=(p&&p.id)||(p&&p.sheetId)||''; var map=window.__PWA_BOOTSTRAP__.wh && window.__PWA_BOOTSTRAP__.wh.countMap; var r=map&&map[id]; if(r) return ok(JSON.parse(JSON.stringify(r))); var items=(window.__PWA_BOOTSTRAP__.wh && window.__PWA_BOOTSTRAP__.wh.items||[]).slice(0,6); var lines=items.map(function(it,i){return {id:'CL-'+i, sheetId:id, itemId:it.id, code:it.code, name:it.name, binId:'', binCode:'A-0'+(i+1), systemQty:18+ (i*2), countedQty:'', diff:0, avgCost:Number(it.cost||0), varianceValue:0};}); return ok({sheet:{id:id, sheetNo:'CNT-DEMO-'+String(id).slice(-4), date:new Date().toISOString().slice(0,10), status:'DRAFT', scope:'demo — all stock', locationId:'LOC-SDQ', lines:lines.length}, lines:lines, progress:{total:lines.length,counted:0,pending:lines.length, diffLines:0, over:0, short:0, varianceValue:0, pct:0}}); },

                  total: (p.items || []).reduce(function (a, l) { return a + l.qty * l.price; }, 0) });
    },
    'pwa.sm.sell': function () { return ok({ ok: true, id: 'SAL-DEMO', invoiceNo: 'INV-SDQ-0' + (++SEQ) }); },
    'pwa.sm.collect': function (p) { return ok({ ok: true, result: { voucherNo: 'RV-0' + (++SEQ), amount: p.amount } }); },
    'pwa.pos.sell': function (p) { return ok({ ok: true, id: 'SAL-POS-' + (++SEQ), invoiceNo: 'POS-0' + (++SEQ), total: (p.items||[]).reduce(function(a,l){return a+l.qty*l.price;},0) }); },

  function api(req) {
    window.__API_CALLS__ = (window.__API_CALLS__ || 0) + 1;
    window.__LAST_REQ__ = req;
    var h = HANDLERS[req.action];

<body>

<div class="pwa-top">
  <div class="ttl" id="pwaTitle">🚚 Salesman</div>
  <div class="net" id="pwaNet">● Online</div>
</div>

<div class="pwa-wrap"><div id="pwaBody"></div></div>
<div class="pwa-bar" id="pwaBar"></div>

<script>
/* ==========================================================================
   §13 — SALESMAN MOBILE APP — v2.19 POLISH
   My stock · Sell (consignment se) · Collect cash · Settle
   KPI glance + camera scan + offline queue + target bar.
   ========================================================================== */
(function () {
  var TABS = [
    { id: 'stock', label: 'My stock', icon: '📦' },
    { id: 'sell', label: 'Sell', icon: '🧾' },
    { id: 'collect', label: 'Collect', icon: '💰' },
    { id: 'settle', label: 'Settle', icon: '🧮' }
  ];
  var S = { q: '', cart: [], customerId: '', customerName: '', amount: '', method: 'CASH', payAmt:'' };

  function items() { return (PWA.data && PWA.data.items) || []; }
  function mystock() { return (PWA.data && PWA.data.myStock) || []; }
  function find(q) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return [];
    return items().filter(function (i) {
      return i.name.toLowerCase().indexOf(q) > -1 || i.code.toLowerCase().indexOf(q) > -1 ||
        String(i.barcode || '').toLowerCase() === q;
    }).slice(0, 40);
  }
  function redraw() { render(PWA.state.tab); }

  function rowCost(r) { return Number(r.avgCost) || Number(r.cost) || Number(r.rate) || 0; }

  function render(tab) {
    var body = PWA.$('#pwaBody'); body.innerHTML = '';
    PWA.state.tab = tab;
    // KPI top bar for all tabs
    body.appendChild(kpiGlance());
    if (tab === 'stock') return viewStock(body);
    if (tab === 'sell') return viewSell(body);
    if (tab === 'collect') return viewCollect(body);
    if (tab === 'settle') return viewSettle(body);
  }

  function kpiGlance(){
    var rows = mystock();
    var sum = PWA.data && PWA.data.stockSummary;
    var val = sum && Number(sum.value)>0 ? Number(sum.value) : rows.reduce(function(a,r){ return a + Number(r.qty||0)*rowCost(r); },0);
    var qty = sum && sum.qty ? sum.qty : rows.reduce(function(a,r){ return a + Number(r.qty||0); },0);
    return PWA.el('div',{class:'kpi-grid'},[
      PWA.el('div',{class:'kpi'},[PWA.el('b',{text: String(rows.length)}), PWA.el('small',{text:'SKUs'})]),
      PWA.el('div',{class:'kpi'},[PWA.el('b',{text: String(qty)}), PWA.el('small',{text:'Qty'})]),
      PWA.el('div',{class:'kpi'},[PWA.el('b',{text: PWA.money(val)}), PWA.el('small',{text:'Total value'})]),
      PWA.el('div',{class:'kpi'},[PWA.el('b',{text: PWA.queuedCount() ? PWA.queuedCount()+' queued' : 'Online'}), PWA.el('small',{text: navigator.onLine?'Ready':'Offline'})])
    ]);
  }

  /* ---------------------------- 1) MY STOCK ------------------------------ */
  function viewStock(body) {
    var rows = mystock();
    var qIn = PWA.el('input',{type:'search', placeholder:'🔎 My stock mein dhoondhein…', 'aria-label':'Search stock', oninput:function(){ filter(this.value); }});
    var host = PWA.el('div',{class:'card'});
    host.appendChild(PWA.el('h3', { text: 'Mera stock (' + rows.length + ' items)' }));
    host.appendChild(PWA.el('div',{class:'f'},[qIn]));
    var list = PWA.el('div');
    function filter(q){
      list.innerHTML='';
      var rr = rows;
      if(q) rr = rr.filter(function(r){ return String(r.name||r.itemName||r.code||'').toLowerCase().indexOf(q.toLowerCase())>-1 || String(r.code||'').toLowerCase().indexOf(q.toLowerCase())>-1; });
      if (!rr.length) {
        list.appendChild(PWA.el('div', { class: 'empty' }, [PWA.el('span',{class:'big',text:'📭'}), PWA.el('div',{text:'No match — try different term'}), PWA.el('small',{text:'ERP ▸ Salesman se stock issue karwayein'})]));
        return;
      }
      rr.forEach(function (r) {
        var qv = Number(r.qty) || 0;
        list.appendChild(PWA.el('div', { class: 'task', onclick:function(){ PWA.toast((r.name||r.code)+' — '+(qv)+' pcs','warn'); } }, [
          PWA.el('div', { class: 'ico', text: qv > 0 ? '📦' : '⚠' }),
          PWA.el('div', { class: 'tx' }, [
            PWA.el('b', { text: (r.name || r.itemName || r.code || 'Item') }),
            PWA.el('small', { text: (r.code || '') + ' · cost ' + PWA.money(rowCost(r)) + ' · retail ' + PWA.money(r.retailValue||0) })
          ]),
          PWA.el('span', { class: 'badge '+(qv===0?'warn':''), text: String(qv)+' pcs' })
        ]));
      });
    }
    filter('');
    host.appendChild(list);
    host.appendChild(PWA.el('div',{style:'display:flex;gap:8px;margin-top:10px'},[
      PWA.el('button',{class:'btn sm', onclick:function(){ PWA.toast('Stock refreshed','ok'); PWA.reload(); }}, '↻ Refresh'),
      PWA.el('button',{class:'btn sm ghost', onclick:function(){ PWA.state.tab='sell'; render('sell'); }}, '🧾 Sell')
    ]));
    body.appendChild(host);
  }

  /* ------------------------------ 2) SELL — FIXED customer picker ---------------- */
  function viewSell(body) {
    var custs = (PWA.data && PWA.data.customers) || [];
    var sellField = PWA.createCustomerField({
      label: 'Customer',
      placeholder: 'Customer naam (optional)',
      customers: custs,
      value: S.customerName,
      selectedId: S.customerId,
      hintId: 'sellCustHint',
      onSelect: function(m, typed){
        S.customerName = m ? m.name : typed;
        S.customerId = m ? m.id : '';
        var hint = document.getElementById('sellCustHint');
        if(m && hint) hint.textContent = (m.phone? m.phone+' · ':'') + (Number(m.bal)? 'Due '+PWA.money(m.bal):'No dues') + (m.priceTier? ' · '+m.priceTier:'');
        else if(hint) hint.textContent = typed? 'Naya: \"'+typed+'\"' : '';
      }
    });
    (function(){ var m=custs.filter(function(c){return c.name.toLowerCase()===String(S.customerName).toLowerCase();})[0]; var h=sellField.hint; if(m&&h) h.textContent=(m.phone?m.phone+' · ':'')+(Number(m.bal)?'Due '+PWA.money(m.bal):'No dues'); })();
    body.appendChild(PWA.el('div', { class: 'card' }, [
      PWA.el('h3', { text: 'Customer' }),
      sellField.wrap,
      sellField.hint
    ]));

    var input = PWA.el('input', {
      type: 'search', placeholder: '🔎 Item scan / naam / code…', 'aria-label':'Search items',
      oninput: function () { S.q = input.value; hits(); }
    });
    var scanBtn = PWA.el('button',{class:'btn sm', onclick:function(){
      if(PWA.scanWithCamera) PWA.scanWithCamera(function(code){ input.value=code; S.q=code; hits(); var l=find(code); if(l.length===1){ addItem(l[0]); } });
      else { var c=prompt('Barcode / code',''); if(c){ input.value=c; S.q=c; hits(); } }
    }}, '📷');
    var bulkBtn = PWA.el('button',{class:'btn sm ghost', onclick:function(){
      if(PWA.openBulkPicker) PWA.openBulkPicker({ items: items(), title:'Bulk add — Sell', onAdd:function(picks){
        picks.forEach(function(p){
          var ex=S.cart.filter(function(l){return l.itemId===p.item.id;})[0];
          if(ex) ex.qty += p.qty; else S.cart.push({ itemId:p.item.id, code:p.item.code, name:p.item.name, qty:p.qty, price:p.item.retail, discount:0 });
        });
        PWA.toast('✅ '+picks.length+' items added','ok'); PWA.haptic(true); redraw();
      }});
    }}, '☑ Bulk');
    var box = PWA.el('div', { id: 'pwaHits' });
    function addItem(i){
      var ex = S.cart.filter(function (l) { return l.itemId === i.id; })[0];
      if (ex) ex.qty += 1;
      else S.cart.push({ itemId: i.id, code: i.code, name: i.name, qty: 1, price: i.retail, discount: 0 });
      input.value = ''; S.q = ''; box.innerHTML=''; redrawCart();
      PWA.haptic(true);
    }
    function hits() {
      box.innerHTML = '';
      if (!S.q) return;
      var list = find(S.q);
      if (!list.length) { box.appendChild(PWA.el('div', { class: 'empty' }, 'Koi item nahi mila')); return; }
      list.forEach(function (i) {
        box.appendChild(PWA.el('div', {
          class: 'task', onclick: function () { addItem(i); }
        }, [
          PWA.el('div', { class: 'ico', text: '📦' }),
          PWA.el('div', { class: 'tx' }, [
            PWA.el('b', { text: i.name }),
            PWA.el('small', { text: i.code + ' · ' + PWA.money(i.retail) + ' · stock ' + i.stock })
          ]),
          PWA.el('span',{class:'badge', text: i.stock<=5 ? 'LOW':''})
        ]));
      });
    }
    body.appendChild(PWA.el('div', { class: 'card' }, [
      PWA.el('h3', { text: 'Items' }), PWA.el('div', { class: 'f' }, [ PWA.el('div',{style:'display:flex;gap:8px'},[ PWA.el('div',{style:'flex:1'},input), scanBtn, bulkBtn ]) ]), box
    ]));

    var cartHost = PWA.el('div',{id:'cartHostSell'});
    body.appendChild(cartHost);
    function redrawCart(){
      cartHost.innerHTML='';
      var c = PWA.el('div', { class: 'card' });
      c.appendChild(PWA.el('h3', { text: 'Bill (' + S.cart.length + ')' }));
      if (!S.cart.length) c.appendChild(PWA.el('div', { class: 'empty' }, [PWA.el('span',{class:'big',text:'🧾'}),PWA.el('div',{text:'Abhi kuch nahi'})]));
      var tot = 0;
      S.cart.forEach(function (l, idx) {
        tot += l.qty * l.price;
        c.appendChild(PWA.el('div', { class: 'line' }, [
          PWA.el('div', { class: 'nm' }, [
            PWA.el('b', { text: l.name }),
            PWA.el('small', { text: l.code + ' × ' + PWA.money(l.price) })
          ]),
          PWA.el('div', { class: 'qty' }, [
            PWA.el('button', { text: '−', onclick: function () { l.qty = Math.max(0, l.qty - 1); if (!l.qty) S.cart.splice(idx, 1); redrawCart(); } }),
            PWA.el('span', { text: String(l.qty) }),
            PWA.el('button', { text: '＋', onclick: function () { l.qty += 1; redrawCart(); } }),
            PWA.el('button',{class:'btn sm ghost', text:'✕', onclick:function(){ S.cart.splice(idx,1); redrawCart(); }})
          ])
        ]));
      });
      if (S.cart.length) {
        c.appendChild(PWA.el('div', { class: 'right', style: 'margin-top:10px' }, [
          PWA.el('div', { class: 'muted', text: 'Total' }),
          PWA.el('div', { class: 'money', style: 'font-size:22px', text: PWA.money(tot) })
        ]));
      }
      cartHost.appendChild(c);
      // store tot for pay
      cartHost.dataset.tot = String(tot);
    }
    redrawCart();

    var methodSel = PWA.el('select', { onchange:function(){ S.method=this.value; } },
      [PWA.el('option',{value:'CASH'},'Cash'), PWA.el('option',{value:'CREDIT'},'Credit / Udhaar'), PWA.el('option',{value:'JAZZCASH'},'JazzCash'), PWA.el('option',{value:'EASYPAISA'},'EasyPaisa')]);
    var paid = PWA.el('input', { type: 'number', placeholder: 'Cash mila (optional)', value: S.payAmt, 'aria-label':'Paid amount', oninput:function(){ S.payAmt=this.value; } });
    if (S.cart.length) {
      body.appendChild(PWA.el('div', { class: 'card' }, [
        PWA.el('div',{class:'row2'},[
          PWA.el('div',{class:'f'},[PWA.el('label',{text:'Payment method'}), methodSel]),
          PWA.el('div',{class:'f'},[PWA.el('label',{text:'Amount received'}), paid])
        ]),
        PWA.el('div',{class:'muted', style:'font-size:11px'}, 'Credit ho to 0 rakh sakte hain — baqaya customer ke khaate mein jayega')
      ]));
    }

    body.appendChild(PWA.el('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},[
      PWA.el('button',{class:'btn ghost', style:'flex:1', onclick:function(){ S.cart=[]; S.payAmt=''; redrawCart(); redraw(); }}, '🗑 Clear'),
      PWA.el('button', {
        class: 'btn ok block big', style:'flex:2', onclick: async function () {
          if (!S.cart.length) return PWA.toast('Pehle item add karein', 'warn');
          var tot = Number(cartHost.dataset.tot||0);
          var paidVal = Number(paid.value);
          if(!paid.value) paidVal = (S.method==='CREDIT' ? 0 : tot);
          try {
            var r = await PWA.call('pwa.sm.sell', {
              customerId: S.customerId, customerName: S.customerName,
              paid: paidVal, method: S.method||'CASH',
              locationId: PWA.data.locationId,
              items: S.cart.map(function (l) { return { itemId: l.itemId, qty: l.qty, price: l.price, discount: 0 }; })
            }, { queueable: true });
            if (r && r.queued) {
              PWA.toast('Offline — sale queue mein save ho gayi', 'warn');
              S.cart = []; S.payAmt = ''; PWA.updateNet(); return redraw();
            }
            PWA.toast('✅ Bill ' + r.invoiceNo + ' ban gaya', 'ok');
            S.cart = []; S.payAmt = ''; redraw(); PWA.reload();
          } catch (e) { PWA.toast(e.message, 'err'); }
        }
      }, '✅ Sale complete karein')
    ]));
  }

  /* ---------------------------- 3) COLLECT — FIXED picker -------------------------------- */
  function viewCollect(body) {
    var custs = (PWA.data && PWA.data.customers) || [];
    var collectField = PWA.createCustomerField({
      label: 'Customer',
      placeholder: 'Customer naam',
      customers: custs,
      value: S.customerName,
      selectedId: S.customerId,
      hintId: 'collectHint',
      onSelect: function(m, typed){
        S.customerName = m ? m.name : typed;
        S.customerId = m ? m.id : '';
        var hint = document.getElementById('collectHint');
        if(m && hint) hint.textContent = (m.phone? m.phone+' · ':'') + (Number(m.bal)? 'Due '+PWA.money(m.bal):'No dues');
        else if(hint) hint.textContent = typed? 'Naya: \"'+typed+'\"' : '';
      }
    });
    (function(){ var m=custs.filter(function(c){return c.name.toLowerCase()===String(S.customerName).toLowerCase();})[0]; var h=collectField.hint; if(m&&h) h.textContent=(m.phone?m.phone+' · ':'')+(Number(m.bal)?'Due '+PWA.money(m.bal):'No dues'); })();
    var amt = PWA.el('input', { type: 'number', placeholder: '0', inputmode: 'decimal', 'aria-label':'Amount' });
    var notes = PWA.el('input', { type: 'text', placeholder: 'Note (optional)', 'aria-label':'Note' });
    var methodSel = PWA.el('select',{},[PWA.el('option',{value:'CASH'},'Cash'),PWA.el('option',{value:'BANK'},'Bank'),PWA.el('option',{value:'JAZZCASH'},'JazzCash')]);

    body.appendChild(PWA.el('div', { class: 'card' }, [
      PWA.el('h3', { text: 'Udhaar wasooli' }),
      collectField.wrap,
      collectField.hint,
      PWA.el('div',{class:'row2', style:'margin-top:8px'},[
        PWA.el('div', { class: 'f' }, [PWA.el('label', { text: 'Amount' }), amt]),
        PWA.el('div', { class: 'f' }, [PWA.el('label', { text: 'Method' }), methodSel])
      ]),
      PWA.el('div', { class: 'f' }, [PWA.el('label', { text: 'Note' }), notes]),
      PWA.el('div',{class:'chip-row'},[
        PWA.el('button',{class:'chip', onclick:function(){ amt.value='5000'; }},'5,000'),
        PWA.el('button',{class:'chip', onclick:function(){ amt.value='10000'; }},'10,000'),
        PWA.el('button',{class:'chip', onclick:function(){ amt.value='20000'; }},'20,000')
      ])
    ]));

    body.appendChild(PWA.el('button', {
      class: 'btn primary block big', onclick: async function () {
        var v = Number(amt.value) || 0;
        if (v <= 0) return PWA.toast('Amount dalen', 'warn');
        if(!S.customerId && !S.customerName) return PWA.toast('Customer chunein','warn');
        try {
          var r = await PWA.call('pwa.sm.collect', {
            customerId: S.customerId, customerName: S.customerName, amount: v, method: methodSel.value||'CASH',
            notes: notes.value.trim(), locationId: PWA.data.locationId
          }, { queueable: true });
          if (r && r.queued) { PWA.toast('Offline — queue mein save ho gaya', 'warn'); amt.value = ''; PWA.updateNet(); return; }
          PWA.toast('✅ ' + PWA.money(v) + ' receive ho gaye', 'ok');
          amt.value = ''; notes.value = ''; redraw();
        } catch (e) { PWA.toast(e.message, 'err'); }
      }
    }, '💰 Receive karein'));
  }

  /* ----------------------------- 4) SETTLE ------------------------------- */
  function viewSettle(body) {
    var rows = mystock();
    var sum = PWA.data && PWA.data.stockSummary;
    var val = sum && Number(sum.value) > 0
      ? Number(sum.value)
      : rows.reduce(function (a, r) { return a + (Number(r.qty) || 0) * rowCost(r); }, 0);
    var c = PWA.el('div', { class: 'card' });
    c.appendChild(PWA.el('h3', { text: 'Settlement summary' }));
    c.appendChild(PWA.el('div', { class: 'right', style: 'padding:10px 0' }, [
      PWA.el('div', { class: 'muted', text: 'Mere paas bacha hua stock (cost par)' }),
      PWA.el('div', { class: 'money', style: 'font-size:24px', text: PWA.money(val) }),
      (sum && Number(sum.items) > 0)
        ? PWA.el('div', { class: 'muted', style: 'margin-top:6px' },
            sum.items + ' items · ' + sum.qty + ' qty · retail ' + PWA.money(sum.retailValue || 0))
        : null
    ]));
    c.appendChild(PWA.el('div', { class: 'empty' },
      [PWA.el('div',{text:'Hisab-kitab aur return ke liye ERP ▸ Salesman ▸ Settle use karein — yahan sirf jaldi check karne ka view hai.'}),
       PWA.el('button',{class:'btn sm', style:'margin-top:8px', onclick:function(){ if(navigator.share) navigator.share({title:'Settlement', text:'Stock value '+PWA.money(val)}); else PWA.toast(PWA.money(val)); }}, '⤴ Share')]));
    body.appendChild(c);

    var q = PWA.queuedCount();
    if (q) {
      body.appendChild(PWA.el('div', { class: 'card' }, [
        PWA.el('h3', { text: 'Offline queue' }),
        PWA.el('div', { class: 'empty', text: q + ' entry sync hona baqi hai' }),
        PWA.el('button', { class: 'btn primary block', onclick: PWA.sync }, '↻ Abhi sync karein')
      ]));
    } else {
      body.appendChild(PWA.el('div',{class:'card'},[
        PWA.el('div',{class:'muted', style:'font-size:12px;text-align:center'}, 'No pending queue — sab synced ✅')
      ]));
    }
  }

  PWA.onSynced = function () { PWA.reload(); };
  PWA.boot('sm', TABS, render);
})();
</script>
</body>
</html>
